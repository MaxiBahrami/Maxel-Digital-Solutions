services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: maxel
      POSTGRES_USER: maxel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/dev-up.sh first}
    volumes:
      - maxel_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxel -d maxel"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://maxel:${POSTGRES_PASSWORD}@db:5432/maxel
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run bash scripts/dev-up.sh first}
      SESSION_SECRET: ${SESSION_SECRET:?Run bash scripts/dev-up.sh first}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  maxel_postgres:
